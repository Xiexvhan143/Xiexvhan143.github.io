<script>

  // 添加拖动事件
  container.querySelectorAll('.skill-item').forEach(item => {
    item.addEventListener('dragstart', function (e) {
      dragItem = this;
      setTimeout(() => this.classList.add('dragging'), 0);
    });

    item.addEventListener('dragend', function () {
      this.classList.remove('dragging');
      dragItem = null;
    });
  });

  // 处理拖动放置
  container.addEventListener('dragover', e => {
    e.preventDefault();
    const afterElement = getDragAfterElement(container, e.clientY);
    if (dragItem && afterElement) {
      container.insertBefore(dragItem, afterElement);
    }
  });

  // 计算放置位置
  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.skill-item:not(.dragging)')];

    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;

      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  // 移动端触摸支持
  let touchStartY = 0;

  container.addEventListener('touchstart', e => {
    if (!e.target.closest('.skill-item')) return;
    dragItem = e.target.closest('.skill-item');
    touchStartY = e.touches[0].clientY;
    dragItem.classList.add('dragging');
  }, { passive: false });

  container.addEventListener('touchmove', e => {
    if (!dragItem) return;
    e.preventDefault();

    const y = e.touches[0].clientY;
    const afterElement = getDragAfterElement(container, y);

    if (afterElement) {
      container.insertBefore(dragItem, afterElement);
    }
  }, { passive: false });

  container.addEventListener('touchend', () => {
    if (dragItem) {
      dragItem.classList.remove('dragging');
      dragItem = null;
    }
  });
</script>
